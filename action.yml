name: Wringer verification
description: Run declared repository checks with the Bun harness and preserve evidence. Does not run coding agents or publish.
inputs:
  repository:
    description: Repository directory whose trusted checks should run
    default: .
  config:
    description: Reserved; only repository-owned .wringer.yaml is supported
    default: .wringer.yaml
outputs:
  evidence-dir:
    description: Absolute directory containing this action's evidence
    value: ${{ steps.verify.outputs.evidence-dir }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.2
    - name: Build the harness separately from the target repository
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        set -euo pipefail
        cd "$ACTION_ROOT"
        bun install --frozen-lockfile
        bun run build
    - id: verify
      name: Verify declared checks; preserve their real exit code
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
        TARGET_REPOSITORY: ${{ inputs.repository }}
        CONFIG: ${{ inputs.config }}
      run: |
        set -euo pipefail
        if [ "$CONFIG" != '.wringer.yaml' ]; then
          echo 'Only repository-owned .wringer.yaml is supported' >&2
          exit 2
        fi
        cd "$TARGET_REPOSITORY"
        output="$PWD/.wringer/runs/action-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        printf 'evidence-dir=%s\n' "$output" >> "$GITHUB_OUTPUT"
        "$ACTION_ROOT/dist/wring" verify --output "$output"
