[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wringer"
# Single-sourced from src/wringer/__init__.py. Two hand-synced copies is
# one copy too many when a release step has to edit both.
dynamic = ["version"]
description = "Works with any coding agent you can start from a terminal and any model behind an OpenAI-compatible endpoint: runs your repo's own gates, records the check red before the work, and refuses what it cannot evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Marc Oakes" }]
keywords = [
  # `ai-dlc` is dropped deliberately: almost no search volume, and among the
  # few who know the term it maps to Harness and AWS. `agent-harness` goes for
  # the same reason — it files this under a category with funded incumbents
  # and undersells what it does.
  "mutation-testing", "test-quality", "gate-sensitivity",
  "verification", "evidence", "gates", "ci",
  "acceptance-criteria", "provenance", "ai-agents",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# jsonschema is DEV-ONLY and validates the published schemas against
# real bundles in CI. The runtime dependency list stays PyYAML and
# nothing else — that is a promise about what users install.
dev = ["pytest>=8.0", "pytest-xdist>=3.0", "ruff>=0.6", "jsonschema>=4.0"]
# **The board ships in this package now, not as a second one.** Four packages
# with two unpublished read as sprawl, and `pip install wringer-drive` was
# unresolvable for months because `wringer-board` was never on the index.
#
# The extra carries no dependencies — the board declared none — so this is a
# packaging decision and not a weight one. What it does NOT dissolve is the
# ARCHITECTURAL seam: `wringer_board` consumes bundles and the CLI as its API
# and may not import engine internals. That is enforced by
# `tests/test_layer_seam.py`, because a package boundary was never what held
# it up.
board = []
# The drive joins on 2026-08-20 for the same reason as the board, and it is the
# package that PROVED the point: it declared `wringer` and `wringer-board` as
# dependencies, one of which was never published, so `pip install
# wringer-drive` could not resolve for months. Inside one distribution the
# dependency it could not satisfy is simply the package it is part of.
drive = []

[project.scripts]
wring = "wringer.cli:main"
wringer-board = "wringer_board.__main__:main"
wringer-drive = "wringer_drive.__main__:main"
wringer = "wringer.cli:main"

[project.urls]
Homepage = "https://github.com/marcoakes/wringer"
Repository = "https://github.com/marcoakes/wringer"
Roadmap = "https://github.com/marcoakes/wringer/blob/main/ROADMAP.md"

[tool.setuptools.dynamic]
version = { attr = "wringer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Upstream's own test files, vendored verbatim as the corpus ground truth. They
# are EVIDENCE, not this project's code: reformatting them would change the
# thing being measured, and a lint failure in somebody else's test is not a
# defect in this repository.
extend-exclude = ["benchmark/corpus/held_out"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear — the checks that
# catch real mistakes. This is the gate Wringer's own .wringer.yaml declares.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# **F811 on a pytest fixture is a false positive, and only here.**
#
# `tests/test_refusal.py` imports `delivery_repo` and friends from
# `test_deliver` so the refusal tests run inside a REAL delivery rather than a
# second copy of the fixture that would drift from the first. pytest then wants
# the same NAME as a parameter, which ruff reads as redefining the import.
#
# Scoped to the one file rather than to `tests/*`, so a genuine redefinition
# anywhere else still fails. The alternative — six `# noqa: F811` comments on
# six function signatures — hides the reason at each site instead of stating it
# once here.
"tests/test_refusal.py" = ["F811"]
# Same false positive, same fixture family, same reason (0.6.2): the
# one-delivery-one-story tests run inside a REAL delivery via
# `test_deliver`'s fixtures rather than a second copy that would drift.
"tests/test_one_delivery_one_story.py" = ["F811"]

# **E501 on the merged board source is DATED DEBT, stated rather than hidden.**
#
# `wringer_board` arrived on 2026-08-20 from a repository that had NO ruff
# gate at all — its CI ran pytest only — so ~500 lines of never-linted code
# met this repo's gate at once: 45 violations. All the ones that could bite
# were fixed (unused imports and locals, ambiguous names, import order,
# percent-format) and `ruff format` was run over it. What is left is
# seventeen long lines, most of them inside a CSS string literal.
#
# They are excluded HERE, by path, so that:
#   - every other rule applies to board code, which none did before;
#   - E501 still applies to every NEW file and to all engine code;
#   - the exclusion is visible with its reason and its date, rather than the
#     line length being raised for the whole project to make a number go away.
#
# Two attempts to wrap them mechanically broke a file each time — an f-string
# and a test — which is the argument for doing it deliberately later rather
# than hastily now.
"src/wringer_board/*.py" = ["E501"]
"tests/board/*.py" = ["E501"]
"src/wringer_drive/*.py" = ["E501"]
"tests/drive/*.py" = ["E501"]
"tools/*.py" = ["E501"]
