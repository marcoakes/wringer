[project]
name = "pipeline"
version = "0.1.0"
description = "A tiny pipeline runner: a job graph, a run, and a summary."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `acceptance/` is deliberately NOT here. It holds checks written from a
# requirement before the requirement is built, so it is red on purpose until
# the feature lands. `pytest -q` is the suite that must stay green.
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "acceptance"]
