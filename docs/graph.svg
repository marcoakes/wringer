<svg xmlns="http://www.w3.org/2000/svg" width="708" height="1052" viewBox="0 0 708 1052" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" role="img" aria-label="a graph parks, a person decides, the graph resumes">
  <style>
    .l { opacity: 0; animation-duration: 9.90s;
         animation-timing-function: linear; animation-iteration-count: infinite; }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
    }
  </style>
  <rect width="100%" height="100%" rx="10" fill="#11141a"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="43" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="20" r="5.5" fill="#28c840"/>
  <text x="354" y="24" fill="#7d8590" font-size="11" text-anchor="middle">a graph parks, a person decides, the graph resumes</text>
  <g>
        <text class="l l0" x="18" y="54" xml:space="preserve" fill="#56b6c2">$ wring graph run graph.yaml</text>
    <text class="l l1" x="18" y="74" xml:space="preserve" fill="#d7dae0">graph demo — 20260809-094758-5bcb</text>
    <text class="l l2" x="18" y="94" xml:space="preserve" fill="#7d8590">→ read  (intent)</text>
    <text class="l l3" x="18" y="114" xml:space="preserve" fill="#7d8590">→ ok  (human)</text>
    <text class="l l4" x="18" y="134" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l5" x="18" y="154" xml:space="preserve" fill="#d7dae0">! parked at &#x27;ok&#x27; — a person must approve this node</text>
    <text class="l l6" x="18" y="174" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l7" x="18" y="194" xml:space="preserve" fill="#d7dae0">Edit:</text>
    <text class="l l8" x="18" y="214" xml:space="preserve" fill="#d7dae0">  .wringer/graphs/20260809-094758-5bcb/nodes/ok/decision.yaml</text>
    <text class="l l9" x="18" y="234" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l10" x="18" y="254" xml:space="preserve" fill="#d7dae0">Then:</text>
    <text class="l l11" x="18" y="274" xml:space="preserve" fill="#d7dae0">  wring graph resume .wringer/graphs/20260809-094758-5bcb</text>
    <text class="l l12" x="18" y="294" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l13" x="18" y="314" xml:space="preserve" fill="#d7dae0">Graph evidence: .wringer/graphs/20260809-094758-5bcb/</text>
    <text class="l l14" x="18" y="334" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l15" x="18" y="354" xml:space="preserve" fill="#56b6c2">$ echo &#x27;approved: true&#x27; | tee .wringer/graphs/*/nodes/ok/decision.yaml</text>
    <text class="l l16" x="18" y="374" xml:space="preserve" fill="#d7dae0">approved: true</text>
    <text class="l l17" x="18" y="394" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l18" x="18" y="414" xml:space="preserve" fill="#56b6c2">$ wring graph resume .wringer/graphs/20260809-094758-5bcb</text>
    <text class="l l19" x="18" y="434" xml:space="preserve" fill="#d7dae0">graph demo — resuming 20260809-094758-5bcb</text>
    <text class="l l20" x="18" y="454" xml:space="preserve" fill="#7d8590">→ ok  (human)</text>
    <text class="l l21" x="18" y="474" xml:space="preserve" fill="#7d8590">→ build  (loop)</text>
    <text class="l l22" x="18" y="494" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l23" x="18" y="514" xml:space="preserve" fill="#7d8590">iteration 1/3</text>
    <text class="l l24" x="18" y="534" xml:space="preserve" fill="#f85149">✗ test failed        0.1s</text>
    <text class="l l25" x="18" y="554" xml:space="preserve" fill="#7d8590">→ worker             0.0s  (exit 0)</text>
    <text class="l l26" x="18" y="574" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l27" x="18" y="594" xml:space="preserve" fill="#7d8590">iteration 2/3</text>
    <text class="l l28" x="18" y="614" xml:space="preserve" fill="#3fb950">✓ test passed        0.1s</text>
    <text class="l l29" x="18" y="634" xml:space="preserve" fill="#7d8590">→ route  (router)</text>
    <text class="l l30" x="18" y="654" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l31" x="18" y="674" xml:space="preserve" fill="#3fb950">✓ done — every node completed</text>
    <text class="l l32" x="18" y="694" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l33" x="18" y="714" xml:space="preserve" fill="#d7dae0">Graph evidence: .wringer/graphs/20260809-094758-5bcb/</text>
    <text class="l l34" x="18" y="734" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l35" x="18" y="754" xml:space="preserve" fill="#56b6c2">$ wring graph status .wringer/graphs/20260809-094758-5bcb</text>
    <text class="l l36" x="18" y="774" xml:space="preserve" fill="#d7dae0">graph demo — 20260809-094758-5bcb</text>
    <text class="l l37" x="18" y="794" xml:space="preserve" fill="#d7dae0">status: done — every node completed</text>
    <text class="l l38" x="18" y="814" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l39" x="18" y="834" xml:space="preserve" fill="#3fb950">  ✓ read   intent  done</text>
    <text class="l l40" x="18" y="854" xml:space="preserve" fill="#3fb950">  ✓ ok     human   done</text>
    <text class="l l41" x="18" y="874" xml:space="preserve" fill="#3fb950">  ✓ build  loop    done</text>
    <text class="l l42" x="18" y="894" xml:space="preserve" fill="#3fb950">  ✓ route  router  done</text>
    <text class="l l43" x="18" y="914" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l44" x="18" y="934" xml:space="preserve" fill="#d7dae0">state:</text>
    <text class="l l45" x="18" y="954" xml:space="preserve" fill="#d7dae0">  brief = nodes/read/brief.md</text>
    <text class="l l46" x="18" y="974" xml:space="preserve" fill="#d7dae0">  build-status = converged</text>
    <text class="l l47" x="18" y="994" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l48" x="18" y="1014" xml:space="preserve" fill="#d7dae0">Graph evidence: .wringer/graphs/20260809-094758-5bcb/</text>
  </g>
