<svg xmlns="http://www.w3.org/2000/svg" width="708" height="832" viewBox="0 0 708 832" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="13" role="img" aria-label="same job, both workers, and no winner">
  <style>
    .l { opacity: 0; animation-duration: 8.80s;
         animation-timing-function: linear; animation-iteration-count: infinite; }
    @media (prefers-reduced-motion: reduce) {
      .l { animation: none; opacity: 1; }
    }
  </style>
  <rect width="100%" height="100%" rx="10" fill="#11141a"/>
  <circle cx="24" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="43" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="20" r="5.5" fill="#28c840"/>
  <text x="354" y="24" fill="#7d8590" font-size="11" text-anchor="middle">same job, both workers, and no winner</text>
  <g>
        <text class="l l0" x="18" y="54" xml:space="preserve" fill="#56b6c2">$ wring bench</text>
    <text class="l l1" x="18" y="74" xml:space="preserve" fill="#7d8590">→ careful</text>
    <text class="l l2" x="18" y="94" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l3" x="18" y="114" xml:space="preserve" fill="#7d8590">iteration 1/3</text>
    <text class="l l4" x="18" y="134" xml:space="preserve" fill="#f85149">✗ test failed        0.1s</text>
    <text class="l l5" x="18" y="154" xml:space="preserve" fill="#7d8590">→ worker             0.0s  (exit 0)</text>
    <text class="l l6" x="18" y="174" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l7" x="18" y="194" xml:space="preserve" fill="#7d8590">iteration 2/3</text>
    <text class="l l8" x="18" y="214" xml:space="preserve" fill="#f85149">✗ test failed        0.1s</text>
    <text class="l l9" x="18" y="234" xml:space="preserve" fill="#7d8590">→ hasty</text>
    <text class="l l10" x="18" y="254" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l11" x="18" y="274" xml:space="preserve" fill="#7d8590">iteration 1/3</text>
    <text class="l l12" x="18" y="294" xml:space="preserve" fill="#f85149">✗ test failed        0.1s</text>
    <text class="l l13" x="18" y="314" xml:space="preserve" fill="#7d8590">→ worker             0.0s  (exit 0)</text>
    <text class="l l14" x="18" y="334" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l15" x="18" y="354" xml:space="preserve" fill="#7d8590">iteration 2/3</text>
    <text class="l l16" x="18" y="374" xml:space="preserve" fill="#3fb950">✓ test passed        0.1s</text>
    <text class="l l17" x="18" y="394" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l18" x="18" y="414" xml:space="preserve" fill="#d7dae0">  careful          oscillating      2 iter     0.5s</text>
    <text class="l l19" x="18" y="434" xml:space="preserve" fill="#d7dae0">  hasty            converged        2 iter     0.5s</text>
    <text class="l l20" x="18" y="454" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l21" x="18" y="474" xml:space="preserve" fill="#d7dae0">What this does not say:</text>
    <text class="l l22" x="18" y="494" xml:space="preserve" fill="#d7dae0">  - One run per contender. Agents are stochastic; a difference within noise is</text>
    <text class="l l23" x="18" y="514" xml:space="preserve" fill="#d7dae0">    noise.</text>
    <text class="l l24" x="18" y="534" xml:space="preserve" fill="#d7dae0">  - Usage and cost are the agent&#x27;s own report, unverified. Absent means</text>
    <text class="l l25" x="18" y="554" xml:space="preserve" fill="#d7dae0">    unreported, never zero.</text>
    <text class="l l26" x="18" y="574" xml:space="preserve" fill="#d7dae0">  - A green gate proves the gates went green, not that the fix is honest —</text>
    <text class="l l27" x="18" y="594" xml:space="preserve" fill="#d7dae0">    read the diffs before believing any row.</text>
    <text class="l l28" x="18" y="614" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l29" x="18" y="634" xml:space="preserve" fill="#d7dae0">Bench evidence: .wringer/benches/20260809-104551-84cc/</text>
    <text class="l l30" x="18" y="654" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l31" x="18" y="674" xml:space="preserve" fill="#56b6c2">$ git -C .wringer/worktrees/20260809-104551-84cc-careful diff --stat HEAD</text>
    <text class="l l32" x="18" y="694" xml:space="preserve" fill="#d7dae0"> calc.py | 2 +-</text>
    <text class="l l33" x="18" y="714" xml:space="preserve" fill="#d7dae0"> 1 file changed, 1 insertion(+), 1 deletion(-)</text>
    <text class="l l34" x="18" y="734" xml:space="preserve" fill="#d7dae0">&#160;</text>
    <text class="l l35" x="18" y="754" xml:space="preserve" fill="#56b6c2">$ git -C .wringer/worktrees/20260809-104551-84cc-hasty diff --stat HEAD</text>
    <text class="l l36" x="18" y="774" xml:space="preserve" fill="#d7dae0"> test_calc.py | 2 +-</text>
    <text class="l l37" x="18" y="794" xml:space="preserve" fill="#d7dae0"> 1 file changed, 1 insertion(+), 1 deletion(-)</text>
  </g>
