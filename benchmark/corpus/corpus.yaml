  - id: packaging-arbitrary-equality-intersection
    repo_key: packaging
    repo_url: https://github.com/pypa/packaging.git
    licence: Apache-2.0 OR BSD-2-Clause (LICENSE, LICENSE.APACHE, LICENSE.BSD)
    base_sha: a1f705642e50b79da6be83fb0f6149daa32fc7cc
    fix_sha: b68980bcd1f6c824a2a154d8b0e8aa5e0a1faa02
    upstream: Fix arbitrary equality intersection preservation in `SpecifierSet` (#951)
    difficulty: discriminating
    why: 'The visible symptom is SpecifierSet(''===1.0,===1.0.0'').filter([...]) returning [''1.0'']
      instead of []. The obvious place to look is filter()/contains(), and a fix there can be
      made to pass the reported reproduction. But the real cause is two layers away: Specifier._canonical_spec
      ran canonicalize_version on the ''==='' operand, so Specifier(''===1.0'') and Specifier(''===1.0.0'')
      hash and compare equal, and SpecifierSet stores members in a frozenset — one of the two
      arbitrary-equality specifiers is silently dropped at construction. An agent that patches
      filter/contains leaves __hash__/__eq__ wrong, so len(SpecifierSet(''===1.0,===1.0.0''))
      is still 1 and set/dict use is still broken, while the existing suite (green at base)
      never checks it. The held-out test asserts the general intersection-preservation law over
      both operand orders and both input orders, which catches the surface patch.'
    source_files:
    - src/packaging/specifiers.py
    pythonpath: src
    gate: pytest -q
    test_deps: &id004
    - pytest==8.3.5
    - pretend
    - hypothesis
    - tomli_w
    held_out:
      files:
      - src: tests__test_specifiers.py
        dest: tests/test_specifiers.py
      tests:
      - test_arbitrary_equality_is_intersection_preserving
      run: '{python} -m pytest tests/test_specifiers.py -q'
    evidence:
