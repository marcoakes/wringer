# THE CORPUS — the committed task list `CORPUS.md` §4 requires before any paid
# run, and it is committed BEFORE the first paid run rather than after.
#
# HOW THESE WERE CHOSEN. Five permissively-licensed, pure-Python repositories
# with offline test suites were mined from their own git history for commits
# that fix a bug AND add tests — upstream's FAIL_TO_PASS shape. 86 commits were
# examined across the five. 25 passed the miner's checks. Each was then handed
# to a SECOND reader told to REFUTE it, which re-ran every measurement from a
# verified-clean tree and dropped 5. Of the 20 survivors, 13 are here.
#
# The rule they were selected against (`benchmark/CORPUS.md`) was written and
# committed before any of this, because whoever picks the tasks can pick the
# result. Everything examined — kept, dropped by the critic, or not selected —
# is recorded in `CORPUS.md` §6.
#
# WHAT A ROW MEANS
#   base_sha      the fix commit's PARENT. Both arms start from exactly this.
#   fix_sha       upstream's real fix. Given to NO arm. Used only by the
#                 zero-cost oracle build, which proves the task is winnable.
#   gate          the repository's OWN suite, as its maintainers run it, and
#                 the single Wringer gate. Where it does not cover the issue is
#                 exactly where Wringer can lose — CORPUS.md §3.
#   held_out      upstream's later tests, copied in ONLY for scoring. The WHOLE
#                 FILE must pass: stricter than the added ids alone, because it
#                 also catches a change that broke a neighbouring test, and it
#                 needs no shell quoting of unicode parametrised node ids.
#   tests         the names upstream ADDED. Never appear in any tree an arm
#                 sees; `check_isolation` enforces that and voids the task if
#                 one does.
#
# THE REPOSITORY IS NEVER INSTALLED into a venv. The working tree must win on
# sys.path, or checking out a different commit changes nothing and every
# measurement here is meaningless. Where a suite carries a test that asserts
# installed-distribution metadata, that ONE file is excluded by name in the
# gate command and the exclusion is visible above — the dishonest alternative
# is `pip install`, which would let an agent that broke `src/` still import a
# working copy and turn a broken tree into a green gate.
#
# PYTEST IS PINNED for click and packaging. Both set `filterwarnings = ["error"]`
# in their own config, and pytest 9 emits a removal warning during collection
# that those repos then turn into a collection failure. An unpinned pytest makes
# every task on them fail for a reason the experiment never chose.

version: 1

tasks:
  - id: marshmallow-data-key-in-schema-validator
    repo_key: marshmallow
    repo_url: https://github.com/marshmallow-code/marshmallow.git
    licence: MIT (LICENSE)
    base_sha: a578ed23092bd558acfbd9cd09a164108689326d
    fix_sha: 9f751e1cef943e2ca1a77f93d3483b4a171d4303
    upstream: Fix handling data_key in ValidationErrors raised in schema validators (#2792)
    difficulty: discriminating
    why: 'Three separate error paths must all collapse onto the same output key: @validates
      (already keyed by data_key at base), @validates_schema raising with field_name=''foo''
      (keyed by attr name at base), and @validates_schema raising the dict {''fooKey'': ...}.
      The held-out test asserts all three merge into ONE list under ''fooKey''. Plausible wrong
      fixes that keep the whole 1223-test suite green: (a) translate field_name -> data_key
      inside ValidationError instead of in Schema._run_validator, which also rewrites errors
      raised from field-level validators and double-translates; (b) handle only the field_name=
      string form and leave the dict form under ''ip_addresses''; (c) do the mapping in error_store.store_error
      globally, which breaks the SCHEMA sentinel path. The repo has ~30 decorator tests at base
      and none exercises data_key together with a schema-level validator, so the repo''s own
      gate does not cover the issue at all. The statement is a real user bug report that prints
      observed and expected dicts, so it is reproducible without naming any test.'
    source_files:
    - src/marshmallow/decorators.py
    - src/marshmallow/schema.py
    - src/marshmallow/types.py
    pythonpath: src
    gate: pytest -q --ignore=tests/test_version_attributes.py
    test_deps: &id001
    - simplejson
    - packaging
    held_out:
      files:
      - src: tests__test_decorators.py
        dest: tests/test_decorators.py
      tests:
      - test_data_key_is_used_in_errors_dict
      run: '{python} -m pytest tests/test_decorators.py -q'
    evidence:
      baseline: 1223 passed in 1.87s
