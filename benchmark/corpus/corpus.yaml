  - id: packaging-filter-exclusionary-bridges
    repo_key: packaging
    repo_url: https://github.com/pypa/packaging.git
    licence: Apache-2.0 OR BSD-2-Clause (LICENSE, LICENSE.APACHE, LICENSE.BSD)
    base_sha: 1b66ec21f7d107a29955b2300806b0d5328b85bc
    fix_sha: 25b1f44e0e9e1a7ccce330c457ba64a74f973836
    upstream: Fix pep440 edge case in `SpecifierSet.filter` (#942)
    difficulty: discriminating
    why: SpecifierSet.filter chained each member Specifier's own filter, so the prereleases=None
      PEP 440 rule ('drop pre-releases unless nothing else matched') was applied independently
      by every member instead of once over the conjunction. With '>=1,!=1.*,!=2.*,!=3.0,<=3.0'
      the only satisfying versions are 3.0 pre-releases, and an intermediate specifier discards
      them before the last one can decide. This is a three-valued flag (None/True/False) crossed
      with member chaining; the correct fix must push prereleases=True through the members and
      apply the None rule once at the end, while still preserving empty-SpecifierSet behaviour
      for True and False. It is easy to produce a patch that fixes the reported example and
      quietly changes behaviour for prereleases=False or the empty set. The existing suite is
      green at base and the held-out file has 107 other filter cases a wrong fix can still satisfy
      — only 2 of 109 are red at base, so the discriminating margin is narrow and precise.
    source_files:
    - src/packaging/specifiers.py
    pythonpath: src
    gate: pytest -q
    test_deps: *id004
    held_out:
      files:
      - src: tests__test_specifiers.py
        dest: tests/test_specifiers.py
      tests:
      - test_filter_exclusionary_bridges
      run: '{python} -m pytest tests/test_specifiers.py -q'
    evidence:
      baseline: 'SKIPPED [1] tests/test_manylinux.py:151: requires Linux / 27152 passed, 1 skipped
        in 14.01s'
      red: 2 failed, 107 passed in 0.53s
      green: 109 passed in 0.37s
    tests_note: the miner also listed test_contains_exclusionary_bridges; the critic isolated
      it at base and found 77 passed — it is PASS_TO_PASS, not FAIL_TO_PASS, and is not held
      out
