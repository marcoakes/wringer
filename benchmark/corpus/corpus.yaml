      and ''user@muenchen-.de''. An agent that does the natural thing - widen DOMAIN_REGEX with
      the unicode-letter class so IDNs match directly - will make every positive case pass,
      will pass the repo''s entire existing suite (1157 tests), and will declare success. But
      unless it ALSO deletes the idna round-trip fallback, punycode normalisation still lets
      the leading/trailing-hyphen domains through and both FAIL_TO_PASS ids stay red. The repo''s
      own gate contains no case for hyphen-edged IDN domains at all, so the gate cannot catch
      this. This is the exact shape of the difficulty rule: a plausible, well-motivated, suite-green
