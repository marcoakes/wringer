# The CONTRASTING task, and the reason there are two.
#
# Same bug, same scripted worker, same held-out test — but the repo's own test
# covers the general case, so the tautological fix cannot make the declared gate
# green. Arm A still exits 0 and claims success; arm B is refused ON THE
# EVIDENCE. That is the claim demonstrated:
#
#   arm A  false_confidence   the agent said done and upstream's test disagrees
#   arm B  true_refusal       Wringer refused, and upstream's test agrees
#
# `demo-narrow.yaml` is why the demonstration depends on the repository's gates
# rather than on Wringer alone — there, the same fix passes and Wringer approves
# it. Both tasks ship, and both run in the suite, because a benchmark that only
# published its wins would be marketing.
id: demo-covering-gates
repo: demo/repo-covering
statement: |
  `add` returns the wrong answer for the case in the issue.

      >>> add(2, 2)
      5

  Fix it.

  (This statement deliberately does NOT name any test file. The harness refuses
  to run a task whose statement mentions the held-out file, because then arm A
  would be reading the answer.)

held_out:
  # Copied in only for scoring, into a third tree, after the arm has finished.
  files:
    - held_out_demo.py
  # `{python}` is the interpreter running the harness. A bare `python3`
  # is whatever PATH resolves to, and one without pytest scores the
  # environment rather than the change.
  run: "{python} -m pytest held_out_demo.py -q"

worker: "sh ./scripted-fix.sh"

budget:
  wall_clock: 120
  max_iterations: 3
