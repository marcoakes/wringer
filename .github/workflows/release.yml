name: release
# Explicit release dispatch only. Pushing main does not publish a package.
# Python/PyPI publishing is retired; original releases remain historical.
# Adoption channel path is unmeasured until this exact workflow is dispatched.
# Historical workflow evidence does not qualify these new artifacts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag matching package.json
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    # The same split and 40-minute hang guard as tests.yml; the rehearsal group runs in parallel below.
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Install the pinned engineering-test browser (not a product runtime)
        run: bun node_modules/playwright/cli.js install --with-deps chromium
      - run: bun scripts/release.ts check-tag
        env:
          WRINGER_RELEASE_TAG: ${{ inputs.tag }}
      - run: bun run validate --group core
      - run: bun scripts/release.ts package
        env:
          WRINGER_RELEASE_PLATFORM: ${{ matrix.platform }}
      - name: Exercise exact packaged archive and offline installer
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          bun scripts/extracted-distribution.ts "build/release/wringer-$version-$PLATFORM.tar.gz" build/release-measurements/extracted
          bun scripts/installer-distribution.ts build/release build/release-measurements/installer
          bun scripts/release-channels.ts build/release build/release-channels @wringer-fixture --fixture
          bun scripts/channel-distribution.ts build/release-channels build/release-measurements/npm
      - name: Exercise Homebrew with the exact local candidate
        if: runner.os == 'macOS'
        run: bun scripts/brew-distribution.ts build/release-channels build/release build/release-measurements/brew --apply-ci-fixture
      - name: Bind claim report to exact artifact bytes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
        run: bun scripts/release-claims.ts build/release build/release-measurements "$PLATFORM" "${RELEASE_TAG#v}"
      - uses: actions/attest@v4
        with:
          subject-path: |
            build/release/*.tar.gz
            build/release/wring-*
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: build/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-evidence-${{ matrix.platform }}
          path: |
            .wringer/native-validation-*/
            build/release-measurements/
          include-hidden-files: true
  rehearsals:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-14
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - name: Install the pinned engineering-test browser (not a product runtime)
        run: bun node_modules/playwright/cli.js install --with-deps chromium
      - run: bun scripts/release.ts check-tag
        env:
          WRINGER_RELEASE_TAG: ${{ inputs.tag }}
      - name: Build the distribution the rehearsals drive
        run: bun run build
      - run: bun run validate --group rehearsals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-rehearsal-evidence-${{ matrix.platform }}
          path: |
            .wringer/native-validation-*/
            build/release-measurements/
            build/adoption-connections/result.json
            build/adoption-connections/delegation-question.png
            docs/rebuild/evidence/m5/browser-*.json
            build/rebuild-browser/*/*.png
          include-hidden-files: true
  permission-adversary:
    uses: ./.github/workflows/linux-dac.yml
    with:
      ref: ${{ inputs.tag }}
  publish-draft:
    needs: [build, rehearsals, permission-adversary]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Prepare a draft release, never overwrite an existing published one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/draft-release.ts artifacts "$RELEASE_TAG" --apply
