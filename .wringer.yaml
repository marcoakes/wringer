# .wringer.yaml — the gates Wringer runs to prove a change is mergeable.
#
# These are the same two commands CI runs and AGENTS.md calls the law.
# Wringer verifies Wringer: the evidence in .wringer.example/ was produced
# by this file.
version: 1

gates:
  - id: lint
    run: ruff check src tests examples scripts
    timeout: 120

  - id: test
    run: pytest -q
    timeout: 600

# M3: the loop's worker and the delivery target for the self-shipped PR.
# The worker is a script, not an agent, and the bundle records this command
# verbatim — the same honesty as every committed demo. It applies the re-lead
# whose job is DEFINED by the committed-red guard in tests/test_docs.py, and
# it refuses (exit 1) if the README has drifted under its anchors.
run:
  worker: "python3 m3/apply_relead.py"
  max_iterations: 2

deliver:
  branch: "wringer/{run}"
