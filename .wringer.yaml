# Standalone verification of the harness itself; no coding worker is implicit.
# Production agent orchestration uses a validated contained execution plan.
version: 1
gates:
  - id: contracts
    run: bun scripts/generate-types.ts --check
    timeout: 60
  - id: types
    run: bun run typecheck
    timeout: 120
  - id: tests
    run: bun test ./packages
    timeout: 600
deliver:
  branch: "wringer/{run}"
